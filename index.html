<!DOCTYPE html>
<html lang="en" class="md-theme-default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blinker</title>
    <link rel="icon" href="/js-final/assets/logo-hPmU4fWf.png" />
    <script>
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, location.pathname.slice(0, -1) + decoded + location.hash);
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/js-final/assets/index-CO2vlPJ5.js"></script>
    <link rel="stylesheet" crossorigin href="/js-final/assets/index-Cy6KXoTi.css">
  </head>

    <noscript>Blinker needs JavaScript to search movies and cars.</noscript>
    <div id="root"></div>
  </body>
</html>
